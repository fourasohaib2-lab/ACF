[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acf"
version = "0.1.0"
description = "Atmospheric Complexity Framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name="Sohaib Foura"}
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "cfgrib",
    "eccodes",
    "matplotlib",
    "cartopy",
    "pyproj",
    "shapely",
    "rasterio",
    "h5py",
    "PySide6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

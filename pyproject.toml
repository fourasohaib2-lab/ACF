[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acf"
version = "0.1.0"
description = "Atmospheric Complexity Framework"
readme = "README.md"
requires-python = ">=3.12"

authors = [
    {name="Sohaib Foura"}
]

dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "xarray",
    "netCDF4",
    "cfgrib",
    "eccodes",
    "matplotlib",
    "cartopy",
    "pyproj",
    "shapely",
    "rasterio",
    "h5py",
    "PySide6",
    "metpy",
    "fastapi",
    "uvicorn",
    "websockets",
]

[project.scripts]
acf-gui = "acf.gui.app:main"
acf-web = "acf.web.hpc_dashboard_server:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "reports",
    "logs",
    "temp",
    "tmp",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E501"]


[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true

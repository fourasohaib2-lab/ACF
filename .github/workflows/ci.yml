# ACF CI — lint, type-check, and test the codebase on every push/PR.
#
# This closes a real gap found during a 2026-09-18 architecture audit:
# ARCHITECTURE.md §3 and ROADMAP.md both state "ruff check and mypy src
# both clean" / a specific tests-passed count as the project's honesty
# bar, but nothing in .github/workflows/ actually enforced it before this
# file - the only existing workflow (daily-forecast-cycle.yml) targets a
# self-hosted HPC runner and never runs on ordinary pushes/PRs.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (full extras + dev tools)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (type-check)
        run: mypy src

      - name: Pytest
        run: PYTHONPATH=src pytest -q
